<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 融入議題教育實例｜首頁</title>
<style>
:root{
  --bg1:#fff7e6;--bg2:#e8f7ff;--ink:#2b2d42;--muted:#555b6e;
  --c1:#ff5d8f;--c2:#ff9f1c;--c3:#2ec4b6;--c4:#3a86ff;--c5:#8338ec;--c6:#06d6a0;--c7:#ef476f;
  --fs:20px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.65;overflow-x:hidden}
button,input,select{font:inherit}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.45;z-index:-1;animation:float 14s ease-in-out infinite}
.b1{width:340px;height:340px;background:#ffc6d9;top:-80px;left:-80px}
.b2{width:300px;height:300px;background:#b8f2e6;bottom:-60px;right:-60px;animation-delay:-5s}
.b3{width:260px;height:260px;background:#cdb4ff;top:40%;left:60%;animation-delay:-9s}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.1)}}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
/* toolbar */
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:12px 16px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.bar .brand{margin-right:auto;font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.pill{border:none;border-radius:999px;padding:8px 16px;background:#fff;color:var(--ink);cursor:pointer;font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,.1);transition:transform .15s}
.pill:hover{transform:translateY(-2px)}
.pill.on{background:var(--c4);color:#fff}
/* hero */
header{text-align:center;padding:40px 0 20px}
header h1{font-size:clamp(2rem,5vw,3.2rem);margin:.2em 0;line-height:1.25;
  background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% auto;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
header p{font-size:1.1rem;color:var(--muted);margin:.3em auto;max-width:820px}
.emoji-row{font-size:2.4rem;letter-spacing:.2em}
.emoji-row span{display:inline-block;animation:bob 2.4s ease-in-out infinite;cursor:pointer}
.emoji-row span:nth-child(2){animation-delay:.3s}.emoji-row span:nth-child(3){animation-delay:.6s}.emoji-row span:nth-child(4){animation-delay:.9s}
@keyframes bob{50%{transform:translateY(-10px)}}
/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:20px 0}
.cat{border-radius:20px;padding:16px 18px;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.12);transition:transform .2s}
.cat:hover{transform:scale(1.03) rotate(-1deg)}
.cat b{display:block;font-size:1.1rem}
.cat small{font-size:.9rem;opacity:.95}
.cat .more{display:none;margin-top:6px;font-size:.9rem}
.cat.open .more{display:block}
/* progress */
.progress{background:#fff;border-radius:20px;padding:16px 20px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin:18px 0;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.track{flex:1;min-width:200px;height:22px;background:#eee;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--c4),var(--c5));transition:width .6s;border-radius:999px}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 18px}
.controls input{flex:1;min-width:220px;padding:12px 18px;border-radius:999px;border:3px solid #ffd6a5;outline:none;background:#fff}
.controls input:focus{border-color:var(--c2)}
.tag{border:none;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tag.on{color:#fff;background:var(--c5)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.card{position:relative;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.1);
  transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column;min-width:0;animation:pop .5s backwards}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.95)}}
.card:hover{transform:translateY(-8px) rotate(-.5deg);box-shadow:0 16px 36px rgba(0,0,0,.16)}
.card .top{padding:22px 22px 16px;color:#fff;position:relative}
.card .num{position:absolute;right:16px;top:10px;font-size:3.2rem;font-weight:900;opacity:.3}
.card .ico{font-size:2.6rem;display:inline-block;transition:transform .4s}
.card:hover .ico{transform:rotate(-12deg) scale(1.2)}
.card h2{margin:6px 0 0;font-size:1.25rem;line-height:1.4}
.card .body{padding:16px 22px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.card .body p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;padding:3px 12px;border-radius:999px;background:#f1f3ff;color:#3a3f8f;font-weight:700}
.acts{display:flex;gap:10px;margin-top:auto;flex-wrap:wrap}
.go,.peek{flex:1;text-align:center;text-decoration:none;border:none;border-radius:14px;padding:12px;font-weight:800;cursor:pointer;min-width:120px}
.go{color:#fff}
.peek{background:#f3f4f8;color:var(--ink)}
.seen{margin-left:8px;vertical-align:middle;background:#fff;color:#06a77d;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:800;display:none}
.card.visited .seen{display:inline-block}
.card.visited .num{opacity:.15}
.like{position:absolute;right:64px;top:16px;background:rgba(255,255,255,.25);border:none;color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:800}
.empty{text-align:center;font-size:1.2rem;color:var(--muted);padding:40px;display:none}
/* quiz */
.panel{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin-top:34px}
.panel h3{margin:0 0 10px;font-size:1.4rem}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.opt{border:3px solid #e3e6ff;background:#fafbff;border-radius:16px;padding:10px 18px;cursor:pointer;font-weight:700;color:var(--ink)}
.opt:hover{border-color:var(--c4)}
.opt.ok{background:#d8fff1;border-color:var(--c6)}
.opt.no{background:#ffe1e8;border-color:var(--c7)}
#quizMsg{font-weight:800;min-height:1.6em}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,40,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.box{background:#fff;border-radius:22px;width:min(1100px,100%);height:min(86vh,900px);display:flex;flex-direction:column;overflow:hidden;animation:pop .3s}
.box .hd{display:flex;gap:10px;align-items:center;padding:12px 16px;color:#fff;flex-wrap:wrap}
.box .hd b{flex:1;font-size:1.1rem;min-width:0}
.box .hd a,.box .hd button{border:none;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);text-decoration:none}
.box iframe{flex:1;border:0;width:100%}
/* toast & confetti */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:999px;font-weight:700;z-index:60;transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.conf{position:fixed;top:-20px;width:12px;height:18px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{text-align:center;color:var(--muted);margin-top:40px;font-size:.95rem}
kbd{background:#fff;border-radius:6px;padding:0 6px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
@media (max-width:600px){
  .grid{grid-template-columns:1fr}
  .bar{position:static;justify-content:center}
  .bar .brand{width:100%}
  .controls input{min-width:0;width:100%}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="bar">
  <div class="brand">🤖 AI × 議題教育</div>
  <button class="pill" id="fsBtn" title="切換字體大小">🔠 字體：A</button>
  <button class="pill" id="sndBtn" title="開關音效">🔊 音效開</button>
  <button class="pill" id="rndBtn" title="隨機挑一個">🎲 隨機探索</button>
  <button class="pill" id="rstBtn" title="清除瀏覽紀錄">♻️ 重設進度</button>
</div>

<div class="wrap">
<header>
  <div class="emoji-row"><span>🌈</span><span>🌏</span><span>🔬</span><span>🎯</span></div>
  <h1>AI 融入議題教育實例</h1>
  <p>七個互動網頁，帶你看 AI 如何在<strong>四大類議題</strong>中扮演學習夥伴——資料整理、情境模擬、創作生成、回饋修訂、行動追蹤。</p>
</header>

<section class="cats" id="cats"></section>

<div class="progress">
  <b>🏅 探索進度</b>
  <div class="track"><div class="fill" id="fill"></div></div>
  <b id="pTxt">0 / 7</b>
</div>

<div class="controls">
  <input id="q" type="search" placeholder="🔍 搜尋關鍵字，例如：海洋、性別、防災、碳足跡…" aria-label="搜尋">
</div>
<div class="controls" id="tags"></div>

<section class="grid" id="grid"></section>
<div class="empty" id="empty">😅 找不到符合的網頁，換個關鍵字試試！</div>

<section class="panel">
  <h3>🧭 小測驗：哪個網頁最適合你？</h3>
  <div id="quizQ" style="font-size:1.1rem"></div>
  <div class="opts" id="quizO"></div>
  <div id="quizMsg"></div>
</section>

<section class="panel">
  <h3>🧩 議題配對挑戰</h3>
  <div id="mQ" style="font-size:1.1rem"></div>
  <div class="opts" id="mO"></div>
  <div id="mMsg" style="font-weight:800;min-height:1.6em"></div>
  <div>得分：<b id="mScore">0</b>　連對：<b id="mStreak">0</b> 🔥</div>
</section>

<footer>
  小技巧：按鍵盤 <kbd>1</kbd>～<kbd>7</kbd> 直接開啟網頁，<kbd>R</kbd> 隨機探索，<kbd>Esc</kbd> 關閉預覽。<br>
  每個子網頁右下角都有「🏠 回首頁」按鈕。
</footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <div class="hd" id="mHd"><b id="mTitle"></b><a id="mOpen" href="#">🚀 全螢幕開啟</a><button id="mClose">✖ 關閉</button></div>
    <iframe id="mFrame" title="預覽"></iframe>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PAGES=[
 {f:"AI融入議題教育實例1.html",t:"議題教育 × AI 融入應用實例",ico:"🌱",c:["#ff5d8f","#ff9f1c"],
  d:"依四大類議題分類，各舉具體的 AI 融入活動：性別平等情境對話、人權新聞多元立場、海洋廢棄物影像辨識、能源情境模擬等。",
  k:["實例卡片","性別平等","人權","海洋","能源","國際教育"],tag:"實例"},
 {f:"AI融入議題教育實例2.html",t:"議題融入 AI 角色與功能",ico:"🎭",c:["#3a86ff","#8338ec"],
  d:"聚焦 AI 在每類議題中「扮演什麼角色、發揮什麼功能」，條列整理並附上教學範例，快速掌握全貌。",
  k:["AI 角色","功能整理","四大類"],tag:"角色"},
 {f:"AI融入議題教育實例3.html",t:"AI 融入四類議題教育教學實例",ico:"🗺️",c:["#2ec4b6","#3a86ff"],
  d:"AI 角色地圖＋導入原則＋課前/課中/課後的教師檢核與評量建議，強調人主導、查證、隱私與行動。",
  k:["角色地圖","導入原則","評量","教師檢核"],tag:"教學設計"},
 {f:"AI融入議題教育實例4.html",t:"校訂課程議題 × AI 教育應用實例",ico:"🏫",c:["#06d6a0","#2ec4b6"],
  d:"以校訂課程角度設計：多元文化故事生成、生命教育情緒日記、校園能源足跡、戶外生態觀察、防災避難、資安法治判斷。",
  k:["校訂課程","生命教育","戶外教育","防災","資安","閱讀"],tag:"實例"},
 {f:"AI融入議題教育實例5.html",t:"AI 融入四類議題教育應用設計",ico:"📊",c:["#8338ec","#ff5d8f"],
  d:"12 個實際應用案例、AI 功能分布、使用原則，以及 AI 融入課程的 6 步驟與評量/風險控管原則。",
  k:["12 案例","6 步驟","風險控管","功能分布"],tag:"教學設計"},
 {f:"AI融入議題教育實例6.html",t:"跨領域議題 × AI 融入教學實例集",ico:"🔗",c:["#ff9f1c","#ef476f"],
  d:"四大類議題對照生成式 AI 角色，每類三項可立即用於課堂或專題：家族口述歷史、校園碳足跡、模擬法庭與假訊息辨識…",
  k:["跨領域","碳足跡","假訊息","口述歷史","專題探究"],tag:"實例"},
 {f:"AI融入議題教育實例7.html",t:"AI 賦能議題教育 · 互動探索",ico:"✨",c:["#ef476f","#8338ec"],
  d:"依十二年國教議題融入精神，逐一點選每個議題（性別、人權、環境、海洋、能源…）看 AI 的角色與應用。",
  k:["互動探索","十二年國教","逐議題"],tag:"角色"}
];
const CATS=[
 {n:"社會與人文涵養類",e:"🤝",c:"#ff5d8f",s:"性別平等、人權、多元文化、家庭、生命、品德",q:"性別"},
 {n:"環境與永續發展類",e:"🌊",c:"#2ec4b6",s:"環境、海洋、能源、戶外教育、國際教育",q:"海洋"},
 {n:"科學與生活知能類",e:"🔬",c:"#3a86ff",s:"科技、資訊、閱讀素養、防災、安全、法治",q:"防災"},
 {n:"個人化適性發展類",e:"🎯",c:"#8338ec",s:"生涯規劃、適性學習、自主學習",q:""}
];
const $=s=>document.querySelector(s);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let visited=new Set(store.get("aiIssueVisited",[])),likes=store.get("aiIssueLikes",{}),muted=store.get("aiIssueMute",false),fsIdx=store.get("aiIssueFs",0),tag="全部";

/* ---------- sound (Web Audio, no files) ---------- */
let ac;
function tone(freq,dur=.12,type="sine",vol=.18,delay=0){
  if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);}catch(e){}
}
const SFX={
  hover:()=>tone(880,.05,"sine",.05),
  click:()=>{tone(660,.08,"triangle");tone(990,.1,"triangle",.15,.06)},
  open:()=>[523,659,784].forEach((f,i)=>tone(f,.15,"sine",.16,i*.07)),
  ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,"triangle",.17,i*.08)),
  no:()=>{tone(300,.2,"sawtooth",.1);tone(220,.25,"sawtooth",.1,.12)},
  pop:()=>tone(1200,.06,"square",.06),
  win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.2,"triangle",.16,i*.1)),
  dice:()=>{for(let i=0;i<8;i++)tone(300+Math.random()*700,.04,"square",.06,i*.06)}
};

/* ---------- render ---------- */
function grad(c){return `linear-gradient(135deg,${c[0]},${c[1]})`}
$("#cats").innerHTML=CATS.map((c,i)=>`<div class="cat" style="background:${c.c}" data-i="${i}"><b>${c.e} ${c.n}</b><small>點我看包含哪些議題 👇</small><div class="more">${c.s}</div></div>`).join("");
document.querySelectorAll(".cat").forEach(el=>el.onclick=()=>{el.classList.toggle("open");SFX.pop();
  const q=CATS[el.dataset.i].q;if(el.classList.contains("open")&&q){$("#q").value=q;draw();toast(`已搜尋「${q}」相關網頁`)}});
const TAGS=["全部","實例","角色","教學設計","★ 我的最愛"];
$("#tags").innerHTML=TAGS.map(t=>`<button class="tag${t===tag?" on":""}">${t}</button>`).join("");
document.querySelectorAll(".tag").forEach(b=>b.onclick=()=>{tag=b.textContent;document.querySelectorAll(".tag").forEach(x=>x.classList.toggle("on",x===b));SFX.click();draw()});

function draw(){
  const q=$("#q").value.trim().toLowerCase();let n=0;
  $("#grid").innerHTML=PAGES.map((p,i)=>{
    const hay=(p.t+p.d+p.k.join(" ")).toLowerCase();
    if(q&&!hay.includes(q))return"";
    if(tag==="★ 我的最愛"?!likes[i]:(tag!=="全部"&&p.tag!==tag))return"";
    n++;
    return `<article class="card${visited.has(i)?" visited":""}" style="animation-delay:${n*.06}s">
      <div class="top" style="background:${grad(p.c)}"><span class="num">${i+1}</span>
        <span class="ico">${p.ico}</span><span class="seen">✔ 已瀏覽</span><h2>${p.t}</h2>
        <button class="like" data-i="${i}" aria-label="加入最愛">${likes[i]?"★":"☆"} 最愛</button></div>
      <div class="body"><p>${p.d}</p>
        <div class="chips">${p.k.map(k=>`<span class="chip">#${k}</span>`).join("")}</div>
        <div class="acts"><button class="peek" data-i="${i}">👀 快速預覽</button>
        <a class="go" href="${encodeURI(p.f)}" data-i="${i}" style="background:${grad(p.c)}">🚀 進入網頁</a></div></div></article>`}).join("");
  $("#empty").style.display=n?"none":"block";
  document.querySelectorAll(".card").forEach(c=>c.onmouseenter=SFX.hover);
  document.querySelectorAll(".peek").forEach(b=>b.onclick=()=>preview(+b.dataset.i));
  document.querySelectorAll(".go").forEach(a=>a.onclick=e=>{e.preventDefault();go(+a.dataset.i)});
  document.querySelectorAll(".like").forEach(b=>b.onclick=e=>{e.stopPropagation();const i=b.dataset.i;likes[i]=!likes[i];store.set("aiIssueLikes",likes);
    likes[i]?SFX.ok():SFX.pop();toast(likes[i]?"已加入我的最愛 ⭐":"已移出我的最愛");draw()});
  prog();
}
$("#q").addEventListener("input",()=>{SFX.pop();draw()});

function mark(i){const had=visited.size;visited.add(i);store.set("aiIssueVisited",[...visited]);
  if(visited.size===PAGES.length&&had<PAGES.length){SFX.win();confetti(160);toast("🎉 太棒了！七個網頁全部探索完成！")}}
function go(i){mark(i);SFX.open();setTimeout(()=>location.href=encodeURI(PAGES[i].f),280)}
function prog(){const v=visited.size;$("#fill").style.width=(v/PAGES.length*100)+"%";$("#pTxt").textContent=`${v} / ${PAGES.length}`}

/* ---------- modal preview ---------- */
function preview(i){const p=PAGES[i];SFX.open();mark(i);
  $("#mHd").style.background=grad(p.c);$("#mTitle").textContent=`${p.ico} ${i+1}. ${p.t}`;
  $("#mOpen").href=encodeURI(p.f);$("#mFrame").src=encodeURI(p.f);$("#modal").classList.add("show");draw()}
function closeM(){$("#modal").classList.remove("show");$("#mFrame").src="about:blank";SFX.pop()}
$("#mClose").onclick=closeM;$("#modal").onclick=e=>{if(e.target.id==="modal")closeM()};

/* ---------- toolbar ---------- */
const FS=[20,23,26],FSN=["A","A+","A++"];
function applyFs(){document.documentElement.style.setProperty("--fs",FS[fsIdx]+"px");$("#fsBtn").textContent="🔠 字體："+FSN[fsIdx]}
$("#fsBtn").onclick=()=>{fsIdx=(fsIdx+1)%3;store.set("aiIssueFs",fsIdx);applyFs();SFX.click()};
function applySnd(){$("#sndBtn").textContent=muted?"🔇 音效關":"🔊 音效開";$("#sndBtn").classList.toggle("on",!muted)}
$("#sndBtn").onclick=()=>{muted=!muted;store.set("aiIssueMute",muted);applySnd();SFX.click()};
function randomPick(){SFX.dice();const cards=PAGES.map((_,i)=>i);let k=0;const t=setInterval(()=>{
  const i=cards[Math.floor(Math.random()*cards.length)];toast(`🎲 ${PAGES[i].ico} ${PAGES[i].t}`);
  if(++k>8){clearInterval(t);const un=cards.filter(x=>!visited.has(x));const pick=(un.length?un:cards)[Math.floor(Math.random()*(un.length||cards.length))];
    toast(`🎯 就決定是你了：${PAGES[pick].t}`);setTimeout(()=>preview(pick),700)}},110)}
$("#rndBtn").onclick=randomPick;
$("#rstBtn").onclick=()=>{if(!confirm("確定要清除探索進度嗎？"))return;visited.clear();store.set("aiIssueVisited",[]);SFX.no();draw();toast("進度已重設")};
document.querySelectorAll(".emoji-row span").forEach((s,i)=>s.onclick=()=>{tone(523*Math.pow(1.26,i),.25,"triangle");confetti(25)});

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="Escape"&&$("#modal").classList.contains("show"))return closeM();
  const n=parseInt(e.key);if(n>=1&&n<=PAGES.length)return go(n-1);
  if(e.key==="r"||e.key==="R")randomPick();
});

/* ---------- toast & confetti ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
function confetti(n){const cs=["#ff5d8f","#ff9f1c","#2ec4b6","#3a86ff","#8338ec","#06d6a0","#ffd166"];
  for(let i=0;i<n;i++){const d=document.createElement("div");d.className="conf";d.style.left=Math.random()*100+"vw";
    d.style.background=cs[i%cs.length];d.style.animationDuration=(2+Math.random()*2)+"s";d.style.animationDelay=Math.random()*.6+"s";
    d.style.borderRadius=Math.random()>.5?"50%":"3px";document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}}

/* ---------- recommender quiz ---------- */
const QUIZ=[
 {q:"你現在最想做什麼？",o:[["快速了解 AI 能扮演哪些角色",[1,6]],["找可以直接上課用的活動",[0,3,5]],["設計課程與評量",[2,4]]]},
 {q:"你喜歡哪種瀏覽方式？",o:[["點來點去互動探索",[6,2]],["看卡片式實例",[0,3,5]],["看完整整理與步驟",[4,1]]]},
 {q:"你最關心哪個面向？",o:[["環境與永續",[3,5,0]],["社會與人文",[0,6,1]],["教學原則與風險",[2,4]]]}
];
let qi=0,score={};
function quiz(){
  if(qi>=QUIZ.length){const best=+Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0],p=PAGES[best];
    $("#quizQ").innerHTML=`🎉 推薦你先看：<b>${p.ico} ${best+1}. ${p.t}</b>`;
    $("#quizO").innerHTML=`<button class="opt ok" id="qGo">🚀 立刻預覽</button><button class="opt" id="qAgain">🔁 再測一次</button>`;
    $("#qGo").onclick=()=>preview(best);$("#qAgain").onclick=()=>{qi=0;score={};$("#quizMsg").textContent="";SFX.click();quiz()};
    SFX.win();confetti(60);return}
  const Q=QUIZ[qi];$("#quizQ").textContent=`第 ${qi+1} / ${QUIZ.length} 題：${Q.q}`;
  $("#quizO").innerHTML=Q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o[0]}</button>`).join("");
  document.querySelectorAll("#quizO .opt").forEach(b=>b.onclick=()=>{Q.o[b.dataset.j][1].forEach((p,r)=>score[p]=(score[p]||0)+3-r);SFX.click();qi++;quiz()});
}
quiz();

/* ---------- matching game ---------- */
const MATCH=[["性別平等","社會與人文涵養類"],["人權","社會與人文涵養類"],["多元文化","社會與人文涵養類"],["生命教育","社會與人文涵養類"],
 ["海洋","環境與永續發展類"],["能源","環境與永續發展類"],["戶外教育","環境與永續發展類"],["國際教育","環境與永續發展類"],
 ["防災","科學與生活知能類"],["資訊","科學與生活知能類"],["閱讀素養","科學與生活知能類"],["法治","科學與生活知能類"],
 ["生涯規劃","個人化適性發展類"]];
let ms=0,st=0,cur;
function nextM(){cur=MATCH[Math.floor(Math.random()*MATCH.length)];$("#mQ").innerHTML=`「<b>${cur[0]}</b>」議題屬於哪一類？`;
  $("#mO").innerHTML=CATS.map(c=>`<button class="opt">${c.e} ${c.n}</button>`).join("");
  document.querySelectorAll("#mO .opt").forEach(b=>b.onclick=()=>{
    if(b.textContent.includes(cur[1])){b.classList.add("ok");ms++;st++;SFX.ok();$("#mMsg").textContent=st>=3?`✅ 答對了！連對 ${st} 題，太強了！`:"✅ 答對了！";if(st%5===0)confetti(50)}
    else{b.classList.add("no");st=0;SFX.no();$("#mMsg").textContent=`❌ 正確答案是「${cur[1]}」`}
    $("#mScore").textContent=ms;$("#mStreak").textContent=st;document.querySelectorAll("#mO .opt").forEach(x=>x.disabled=true);setTimeout(nextM,1300)})}
nextM();

applyFs();applySnd();draw();
</script>
</body>
</html>
